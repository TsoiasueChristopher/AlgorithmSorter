name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x  # match your project's target framework

      - name: Publish
        run: dotnet publish  SortingVisualizer.csproj -c Release -o release

      - name: Set base href
        run: sed -i 's|<base href="/" />|<base href="/AlgorithmSorter/" />|' release/wwwroot/index.html


      - name: SPA fallback for deep links
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4